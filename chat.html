<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNBOUND SHOP — Live Chat 💬</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14141f; color: #eee; display: flex; flex-direction: column; height: 100vh; }
  #head { background: #7c3aed; padding: 14px; font-weight: 700; font-size: 17px; text-align: center; }
  #body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: #2a2a3d; align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: #7c3aed; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
  .btn { background: #3a3a55; color: #fff; border: 1px solid #7c3aed; border-radius: 20px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #7c3aed; }
  #inputbar { display: flex; padding: 12px; background: #1e1e2e; max-width: 640px; width: 100%; margin: 0 auto; }
  #text { flex: 1; background: #2a2a3d; border: none; border-radius: 24px; padding: 12px 18px; color: #fff; font-size: 15px; outline: none; }
  #send { background: #7c3aed; border: none; color: #fff; border-radius: 50%; width: 46px; height: 46px; margin-left: 10px; cursor: pointer; font-size: 18px; }
</style>
</head>
<body>
<div id="head">💎 UNBOUND SHOP — Live Chat</div>
<div id="body"></div>
<div id="inputbar"><input id="text" placeholder="লিখুন..." autocomplete="off"/><button id="send">➤</button></div>
<script>
(function () {
  var sessionId = 'w' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  var body = document.getElementById('body'), input = document.getElementById('text');
  function addMsg(text, cls, buttons) {
    var d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; body.appendChild(d);
    if (buttons && buttons.length) {
      var wrap = document.createElement('div'); wrap.className = 'btns';
      buttons.forEach(function (row) { row.forEach(function (b) {
        var be = document.createElement('button'); be.className = 'btn'; be.textContent = b.text;
        be.onclick = function () { addMsg(b.text, 'user'); send('', b.action); };
        wrap.appendChild(be);
      }); });
      body.appendChild(wrap);
    }
    body.scrollTop = body.scrollHeight;
  }
  function send(text, action) {
    var p = { sessionId: sessionId };
    if (action) p.action = action; else p.text = text;
    fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) })
      .then(function (r) { return r.json(); })
      .then(function (d) { (d.replies || []).forEach(function (r) { addMsg(r.text, 'bot', r.buttons); }); })
      .catch(function () { addMsg('দুঃখিত, সমস্যা হচ্ছে 😔', 'bot'); });
  }
  document.getElementById('send').onclick = function () {
    var v = input.value.trim(); if (!v) return;
    addMsg(v, 'user'); input.value = ''; send(v, null);
  };
  input.onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('send').click(); };
  send('', null); // greeting
})();
</script>
</body>
</html>
